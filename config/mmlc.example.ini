# mmlc.ini -- runtime config read by the steam_api.dll proxy.
# Place next to Proteus.exe.

# NOP the 0xDF callee-ret stub writer so randomized/patched ROMs behave.
# 1 = enabled (default), 0 = leave the stock overlays in place.
nop_overlay=1

# AOB-scan for the NESSystem virtuals (bank_xlate/read6502/advance) and log
# their runtime VAs. 1 = enabled (default), 0 = off.
scan=1

# Runtime ROM injection: hook the per-game overlay writer and copy a same-size
# ROM from rom_dir/<key>.bin over the in-memory ROM buffer. 0 = off (default).
# Files may be headerless PRG or iNES (.nes; the 16-byte header is stripped).
rom_inject=0

# Directory (relative to Proteus.exe) holding injection blobs. Keys: mm1..mm6.
rom_dir=roms

# In-engine randomization (MM1): randomize the loaded ROM at runtime, no
# external tool needed. 1 = on, 0 = off (default).
randomize=0

# Seed for the randomizer. "random" picks a fresh seed each launch (logged so
# it can be reproduced); or set an explicit string for a fixed seed.
seed=random

# Apply the weakness visualizer so the stage select shows weaknesses.
# 1 = on (default), 0 = off.
visualizer=1

# Randomize Mega Man's sprite + per-weapon palettes from the seed.
# 1 = on (default), 0 = off.
palette=1

# Append a diagnostic line to mmlc_proxy.log next to Proteus.exe.
log=1

# Phase 6 (docs/MESEN.md): run the game through the x64 Mesen host process
# instead of the Eclipse core. Requires mesen_host listening on the port below.
# 1 = on, 0 = off (default). Falls back to the Eclipse core if it can't connect.
mesen=0
mesen_host=127.0.0.1
mesen_port=36344

# MMLC reads only XInput controllers. When enabled, the proxy hooks
# XInputGetState so any connected controller drives the game (falls back to the
# first connected pad when the queried index is empty). 1 = on (default).
all_controllers=1
